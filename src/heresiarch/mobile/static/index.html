<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Heresiarch">
<!-- Relative URLs so the same bundle serves at the LAN root and under
     a subpath (GitHub Pages /heresiarch/) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Heresiarch</title>
<style>
  :root {
    --bg: #0d0d12; --card: #17171f; --card2: #1f1f2a; --line: #2c2c3a;
    --fg: #e8e4d8; --dim: #8a8698; --gold: #d4af37; --accent: #7c5cff;
    --green: #4caf7d; --yellow: #d4b937; --red: #e05555; --blue: #5aa0e0;
  }
  * { box-sizing: border-box; touch-action: manipulation; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 15px; -webkit-text-size-adjust: 100%; }
  body { padding: env(safe-area-inset-top) 10px calc(90px + env(safe-area-inset-bottom)) 10px; }
  h1 { font-size: 26px; letter-spacing: 6px; text-align: center; color: var(--gold);
    margin: 24px 0 4px; font-weight: 600; }
  .sub { text-align: center; color: var(--dim); font-size: 12px; margin-bottom: 20px; }
  .topbar { display: flex; justify-content: space-between; align-items: center;
    padding: 10px 2px 8px; position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .topbar .brand { color: var(--gold); letter-spacing: 3px; font-size: 13px; }
  .topbar .gold { color: var(--gold); font-size: 14px; }
  .phase { color: var(--dim); font-size: 11px; letter-spacing: 1px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; margin: 8px 0; }
  .card.tappable:active { background: var(--card2); }
  .row { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1; min-width: 0; }
  .name { font-weight: 600; }
  .dim { color: var(--dim); font-size: 12px; }
  .small { font-size: 12px; }
  button { font: inherit; color: var(--fg); background: var(--card2);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    min-height: 44px; cursor: pointer; }
  button:active { filter: brightness(1.3); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff;
    font-weight: 600; width: 100%; font-size: 16px; }
  button.gold { background: #3a3010; border-color: var(--gold); color: var(--gold); }
  button.danger { border-color: var(--red); color: var(--red); }
  button:disabled { opacity: 0.35; }
  .hpbar { height: 8px; border-radius: 4px; background: #2a2a35; overflow: hidden; margin-top: 4px; }
  .hpbar > div { height: 100%; border-radius: 4px; transition: width .25s; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { padding: 9px 12px; border-radius: 18px; border: 1px solid var(--line);
    background: var(--card2); font-size: 13px; min-height: 38px; }
  .chip.sel { border-color: var(--accent); background: #2b2050; color: #fff; }
  .chip.cd { opacity: 0.35; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-top: 8px; }
  .seg button { flex: 1; border: 0; border-radius: 0; background: var(--card); min-height: 40px; font-size: 13px; }
  .seg button.sel { background: var(--accent); color: #fff; font-weight: 600; }
  .badge { display: inline-block; padding: 2px 7px; border-radius: 9px; font-size: 11px;
    border: 1px solid var(--line); color: var(--dim); margin-left: 4px; }
  .badge.ap { color: var(--blue); border-color: var(--blue); }
  .badge.ins { color: var(--accent); border-color: var(--accent); }
  .badge.frz { color: var(--red); border-color: var(--red); }
  .badge.debt { color: var(--yellow); border-color: var(--yellow); }
  .log { background: #101016; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; font-size: 12px; line-height: 1.55; max-height: 34vh;
    overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
  .log .ev-damage { color: #e08585; }
  .log .ev-heal { color: #7fd6a4; }
  .log .ev-buff { color: #9bb8ff; }
  .log .ev-debuff { color: #e0b070; }
  .log .ev-death { color: #c05555; font-weight: 700; }
  .log .ev-neutral { color: var(--dim); }
  pre.text { background: #101016; border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; font-size: 12px; line-height: 1.5; overflow-x: auto; white-space: pre-wrap; }
  .sticky-bottom { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px
    calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); z-index: 10; }
  input[type=text] { font: inherit; font-size: 16px; width: 100%; padding: 12px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--card2); color: var(--fg); }
  #toast { position: fixed; top: 12px; left: 12px; right: 12px; z-index: 100;
    background: #3a1520; border: 1px solid var(--red); color: #ffd8d8; padding: 12px;
    border-radius: 10px; font-size: 13px; display: none; }
  details summary { cursor: pointer; color: var(--dim); font-size: 13px; padding: 6px 0; }
  .charge { color: var(--yellow); font-size: 12px; }
  .status { color: var(--blue); font-size: 11px; }
  .section { color: var(--dim); font-size: 11px; letter-spacing: 2px; margin: 14px 2px 4px; }
  .stepper { display: flex; align-items: center; gap: 10px; }
  .stepper button { min-width: 44px; }
  .slotrow { border-top: 1px dashed var(--line); padding: 8px 0 4px; margin-top: 8px; }
  .slotrow b { font-weight: 600; }
  .slotedit { margin: 8px 0 4px; padding: 8px; background: #12121a; border-radius: 8px;
    border: 1px solid var(--line); }
  /* ASCII map: pannable <pre> with absolutely-positioned tap targets */
  .mapscroll { background: #0a0a10; border: 1px solid var(--line); border-radius: 10px;
    overflow: auto; max-height: 44vh; margin: 8px 0; -webkit-overflow-scrolling: touch; }
  .mapwrap { position: relative; display: inline-block; font-size: 11px; line-height: 14px;
    padding: 0; }
  pre.map { margin: 6px; font-size: inherit; line-height: inherit; white-space: pre; }
  .maptap { position: absolute; width: 28px; height: 28px; margin: 6px;
    transform: translate(-50%,-50%); border-radius: 50%; background: transparent; z-index: 2; }
</style>
</head>
<body>
<div id="toast"></div>
<div id="app"><div class="sub" style="margin-top:40vh">loading…</div></div>

<script>
"use strict";
let S = null;                 // last StatePayload
const ui = {
  selJob: null, D: {}, lastRound: -1, lastPhase: "",
  pickUse: null, lootSel: new Set(), busy: false,
  confirm: null,       // pending destructive-action key ("rest", "dismiss:<id>", …)
  equipPreview: null,  // {cid, item_id, data: EquipPreview}
  mapKey: null, mapSel: null,          // ASCII map selection state
  mapScroll: null, mapScrolled: false, // pan position, kept across re-renders
  verbose: (localStorage.getItem("hx_log") || "verbose") !== "summary",
  pb: null,          // active event playback {evs, i, timer, hp, dead}
  auto: false,       // auto-battle loop engaged
};

function esc(s) {
  return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toast._h); toast._h = setTimeout(() => t.style.display = "none", 4000);
}
// Transport seam: LAN mode fetches the FastAPI server; Pyodide mode
// (engine-in-wasm) installs window.HX_LOCAL_DISPATCH before this script
// runs and the whole client works serverless, unchanged.
async function transport(path, body) {
  if (window.HX_LOCAL_DISPATCH) return window.HX_LOCAL_DISPATCH(path, body || null);
  const res = await fetch(path, body ? {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body),
  } : undefined);
  return res.json();
}
async function api(path, body) {
  if (ui.busy) return; ui.busy = true;
  try {
    const payload = await transport(path, body);
    onPayload(payload);
  } catch (e) {
    toast("Connection lost: " + e.message);
  } finally { ui.busy = false; }
}
const act = (tool, args) => api("/api/action", {tool, args: args || {}});

function onPayload(p) {
  const prevPhase = ui.lastPhase;
  stopPlayback();
  S = p;
  ui.confirm = null; ui.equipPreview = null;
  if (p.error) { toast(p.error); ui.auto = false; }
  if (p.phase !== ui.lastPhase) {
    ui.pickUse = null;
    if (p.phase === "POST_COMBAT") ui.lootSel = new Set((p.loot?.items || []).map((_, i) => i));
    if (p.phase !== "COMBAT") ui.auto = false;
    ui.lastPhase = p.phase;
  }
  if (p.combat && p.combat.round_number !== ui.lastRound) {
    rebuildDecisions(); ui.lastRound = p.combat.round_number;
  }
  // A round just resolved: replay its events paced instead of snapping
  const evs = ui.verbose ? p.events : p.events_summary;
  if (prevPhase === "COMBAT" && evs && evs.length) {
    startPlayback(evs);
  } else {
    render();
  }
}

// ---------- paced event playback ----------
function startPlayback(evs) {
  const animateHp = S.phase === "COMBAT" && ui.verbose;
  ui.pb = {
    evs, i: 0, timer: null,
    hp: animateHp ? {...(S.hp_start || {})} : null,
    dead: {},
  };
  render();
  pbTick();
}
function stopPlayback() {
  if (ui.pb && ui.pb.timer) clearTimeout(ui.pb.timer);
  ui.pb = null;
}
function pbTick() {
  const pb = ui.pb;
  if (!pb) return;
  if (pb.i >= pb.evs.length) { pbFinish(); return; }
  const e = pb.evs[pb.i++];
  pbApply(e);
  pbAppendLine(e);
  pbUpdateHpBars();
  pb.timer = setTimeout(pbTick, e.delay_ms || 250);
}
function pbSkip() {
  const pb = ui.pb;
  if (!pb) return;
  if (pb.timer) clearTimeout(pb.timer);
  while (pb.i < pb.evs.length) pbApply(pb.evs[pb.i++]);
  pbFinish();
}
function pbFinish() {
  ui.pb = null;
  render();
  autoContinue();
}
function pbApply(e) {
  // Mirror of the TUI's _apply_display_event: progressive HP state
  const pb = ui.pb;
  if (!pb || !pb.hp) return;
  const hit = (id, dmg) => { if (id in pb.hp) pb.hp[id] = Math.max(0, pb.hp[id] - dmg); };
  switch (e.type) {
    case "DAMAGE_DEALT": hit(e.self_damage ? e.actor_id : e.target_id, e.value); break;
    case "DOT_TICK":
    case "RETALIATE_TRIGGERED":
    case "THORNS_TRIGGERED": hit(e.target_id, e.value); break;
    case "HEALING":
      if (e.target_id in pb.hp)
        pb.hp[e.target_id] = Math.min(maxHpOf(e.target_id), pb.hp[e.target_id] + e.value);
      break;
    case "DEATH": pb.dead[e.target_id] = true; if (e.target_id in pb.hp) pb.hp[e.target_id] = 0; break;
  }
}
function maxHpOf(id) {
  const all = [...(S.combat?.players || []), ...(S.combat?.enemies || [])];
  return (all.find(c => c.id === id) || {max_hp: 9999}).max_hp;
}
function evLine(e) {
  return `<div class="ev-${esc(e.color || "neutral")}">${esc(e.text)}</div>`;
}
function pbAppendLine(e) {
  const log = document.getElementById("log");
  if (!log) return;
  const div = document.createElement("div");
  div.className = "ev-" + (e.color || "neutral");
  div.textContent = e.text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}
function pbUpdateHpBars() {
  const pb = ui.pb;
  if (!pb || !pb.hp) return;
  for (const [id, hp] of Object.entries(pb.hp)) {
    const max = maxHpOf(id);
    const bar = document.querySelector(`[data-hpbar="${CSS.escape(id)}"] > div`);
    if (bar) {
      const pct = max > 0 ? Math.max(0, Math.min(100, 100 * hp / max)) : 0;
      bar.style.width = pct + "%";
      bar.style.background = pct > 50 ? "var(--green)" : pct > 25 ? "var(--yellow)" : "var(--red)";
    }
    const txt = document.querySelector(`[data-hptext="${CSS.escape(id)}"]`);
    if (txt) txt.textContent = pb.dead[id] ? "✝" : hp + "/" + max;
  }
}
function dispHp(c) {
  // During playback, cards show the progressive HP, not the final state
  const pb = ui.pb;
  if (pb && pb.hp && c.id in pb.hp) {
    return {hp: pb.hp[c.id], alive: !pb.dead[c.id]};
  }
  return {hp: c.hp, alive: c.is_alive};
}
function autoContinue() {
  if (!ui.auto || !S || S.phase !== "COMBAT") { ui.auto = false; return; }
  const c = S.combat;
  if (!c || !c.auto_available) {
    ui.auto = false;
    toast("Auto-battle stopped — strategy exhausted");
    render(); return;
  }
  if (c.auto_halt) {
    ui.auto = false;
    toast("Auto-battle stopped — " + c.auto_halt);
    render(); return;
  }
  act("auto_battle_round");
}
async function fetchEquipPreview(cid, itemId) {
  try {
    const p = await transport("/api/preview_equip", {character_id: cid, item_id: itemId});
    if (!p.ok) { toast(p.error || "Preview failed"); return; }
    ui.equipPreview = {cid, item_id: itemId, data: p};
    ui.pickUse = null;
    render();
  } catch (e) { toast("Connection lost: " + e.message); }
}

// ---------- decision state ----------
// Each character's turn is a queue: primary action + one slot per cheat
// AP + one slot per speed-bonus action. Slots default to mirroring the
// primary (fast path = zero extra taps) but each can be edited to its
// own ability + target, or Wait (windup push); bonus slots can be
// skipped.
function defaultAbility(p) {
  const ok = p.abilities.filter(a => a.cooldown_remaining === 0);
  const off = ok.find(a => a.category === "OFFENSIVE");
  return (off || ok[0] || p.abilities[0] || {id: null}).id;
}
function newSlot() { return {ability: null, target: null}; }
function rebuildDecisions() {
  const D = {};
  for (const p of (S.combat?.players || []).filter(p => p.is_alive)) {
    const prev = ui.D[p.id] || {};
    const abil = p.abilities.some(a => a.id === prev.ability && a.cooldown_remaining === 0)
      ? prev.ability : defaultAbility(p);
    D[p.id] = {
      mode: "normal", ability: abil, target: null, useItem: false,
      item: null, itemTarget: p.id, ap: Math.min(1, p.ap) || 1,
      extras: [newSlot()],
      bonus: Array.from({length: p.speed_bonus}, newSlot),
      editSlot: null,
    };
  }
  ui.D = D;
}
function abilityOf(p, id) { return p.abilities.find(a => a.id === id); }
function livingEnemies() { return (S.combat?.enemies || []).filter(e => e.is_alive); }
function livingPlayers() { return (S.combat?.players || []).filter(p => p.is_alive); }
function combatantName(id) {
  const all = [...(S.combat?.players || []), ...(S.combat?.enemies || [])];
  return (all.find(c => c.id === id) || {name: id}).name;
}
function resolveTargetFor(p, abilityId, wanted) {
  const ab = abilityOf(p, abilityId);
  if (!ab) return null;
  if (ab.target === "SINGLE_ENEMY") {
    const es = livingEnemies();
    return es.some(e => e.id === wanted) ? wanted : (es[0]?.id ?? null);
  }
  if (ab.target === "SINGLE_ALLY") {
    const ps = livingPlayers();
    return ps.some(x => x.id === wanted) ? wanted : p.id;
  }
  return null; // SELF / ALL_* — engine fills
}
function getSlot(d, key) {
  return key[0] === "x" ? d.extras[+key.slice(1)] : d.bonus[+key.slice(1)];
}
function slotAbility(p, d, slot) {
  if (slot.ability) return slot.ability;
  // Mirror the primary; if the primary is an item, fall back to the
  // default ability (an item can't be echoed by extra/bonus slots here).
  return d.useItem ? defaultAbility(p) : d.ability;
}
function slotAction(p, d, slot) {
  const aid = slotAbility(p, d, slot);
  if (aid === "__wait__") return {action: "wait"};
  const t = resolveTargetFor(p, aid, slot.target);
  return t ? {ability: aid, target: t} : {ability: aid};
}
function buildDecisions() {
  const out = {};
  for (const p of livingPlayers()) {
    const d = ui.D[p.id];
    if (!d) return null;
    if (d.mode === "survive") { out[p.id] = {mode: "survive"}; continue; }
    const e = {mode: d.mode === "cheat" ? "cheat" : "normal"};
    if (d.useItem) {
      if (!d.item) { toast(p.name + ": pick an item"); return null; }
      e.action = "use_item"; e.item_id = d.item; e.target = d.itemTarget || p.id;
    } else {
      if (!d.ability) { toast(p.name + ": pick an ability"); return null; }
      e.action = d.ability;
      const t = resolveTargetFor(p, d.ability, d.target);
      if (t) e.target = t;
    }
    if (d.mode === "cheat") {
      e.ap_spend = d.ap;
      e.cheat_extras = d.extras.map(s => slotAction(p, d, s));
    }
    const bonus = d.bonus.filter(s => s !== null).map(s => slotAction(p, d, s));
    if (bonus.length) e.bonus_actions = bonus;
    out[p.id] = e;
  }
  return out;
}

// ---------- shared render helpers ----------
function hpbar(hp, max, id) {
  const pct = max > 0 ? Math.max(0, Math.min(100, 100 * hp / max)) : 0;
  const color = pct > 50 ? "var(--green)" : pct > 25 ? "var(--yellow)" : "var(--red)";
  return `<div class="hpbar"${id ? ` data-hpbar="${esc(id)}"` : ""}><div style="width:${pct}%;background:${color}"></div></div>`;
}
function partyStrip() {
  if (!S.party) return "";
  return S.party.characters.filter(c => c.is_active).map(c => `
    <div class="card">
      <div class="row">
        <div class="grow"><span class="name">${esc(c.name)}</span>
          <span class="dim">${esc(c.job_name)} Lv${c.level}${c.is_mc ? " ★" : ""}</span></div>
        <div class="small">${c.hp}/${c.max_hp}</div>
      </div>
      ${hpbar(c.hp, c.max_hp)}
    </div>`).join("");
}
function itemDetail(it) {
  const bits = [esc(it.type)];
  if (it.heal_amount) bits.push(`heals ${it.heal_amount}`);
  if (it.heal_percent) bits.push(`heals ${Math.round(it.heal_percent * 100)}%`);
  if (it.hp_bonus) bits.push(`+${it.hp_bonus} HP`);
  for (const [k, v] of Object.entries(it.flat_stat_bonus || {}))
    bits.push(`${v >= 0 ? "+" : ""}${v} ${k}`);
  if (it.scaling_desc) bits.push(esc(it.scaling_desc));
  if (it.granted_ability) bits.push(`grants ${esc(it.granted_ability)}`);
  if (it.teaches_ability) bits.push(`teaches ${esc(it.teaches_ability)}`);
  if (it.casts_ability) bits.push(`casts ${esc(it.casts_ability)} (combat)`);
  for (const [k, v] of Object.entries(it.combat_stat_buff || {}))
    bits.push(`+${v} ${k} for one fight`);
  return bits.join(" · ");
}
function confirmRow(key, label, action, extra) {
  // Two-step destructive button: first tap arms, second confirms.
  if (ui.confirm === key) {
    return `<button class="danger" data-a="${action}" ${extra || ""}>Confirm</button>
      <button data-a="confirm-cancel">✕</button>`;
  }
  return `<button data-a="confirm-arm" data-key="${esc(key)}">${label}</button>`;
}
function equipPreviewPanel() {
  const ep = ui.equipPreview;
  if (!ep) return "";
  const d = ep.data;
  const ch = S.party.characters.find(c => c.id === ep.cid) || {name: ep.cid};
  const it = S.party.stash.find(x => x.id === ep.item_id) || {name: ep.item_id};
  const rows = Object.keys(d.current).map(k => {
    const a = d.current[k], b = d.preview[k];
    const color = b > a ? "var(--green)" : b < a ? "var(--red)" : "var(--dim)";
    return `<div class="row small"><span class="dim grow">${k}</span>
      <span>${a} → <b style="color:${color}">${b}</b></span></div>`;
  }).join("");
  const hpColor = d.preview_max_hp > d.current_max_hp ? "var(--green)"
    : d.preview_max_hp < d.current_max_hp ? "var(--red)" : "var(--dim)";
  return `<div class="card" style="border-color:var(--accent)">
    <div class="name small">${esc(it.name)} → ${esc(ch.name)} <span class="dim">(${esc(d.slot)})</span></div>
    ${d.replacing ? `<div class="dim small">replaces ${esc(d.replacing)}</div>` : ""}
    <div style="margin-top:6px">${rows}
      <div class="row small"><span class="dim grow">Max HP</span>
        <span>${d.current_max_hp} → <b style="color:${hpColor}">${d.preview_max_hp}</b></span></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="primary grow" data-a="equip-confirm">Equip</button>
      <button data-a="equip-cancel">Cancel</button>
    </div></div>`;
}
function stashPanel(opts) {
  if (!S.party) return "";
  const canUse = !!(opts && opts.use), canSell = !!(opts && opts.sell);
  const chars = S.party.characters;
  const header = `Stash (${S.party.stash_used}/${S.party.stash_limit})`;
  if (!S.party.stash.length) return `<details><summary>${header}</summary><div class="dim small" style="padding:6px 2px">empty</div></details>`;
  const rows = S.party.stash.map((it, i) => {
    let actions = "";
    if (ui.pickUse === i) {

// ---------- ASCII map ----------
// Marker chars/colors mirror tui/widgets/map_viewer.py; the statuses,
// path frontier, and tap actions come resolved from the server (MapVM).
const MAP_LINE_H = 14; // must match .mapwrap line-height
const MAP_MARKERS = {
  zone:      {locked: ["?", "#555555", 0], available: ["o", "#e6c566", 1], cleared: ["*", "#44aa44", 1]},
  town:      {locked: ["?", "#555555", 0], available: ["T", "#c8a2c8", 1], cleared: ["T", "#c8a2c8", 1]},
  building:  {locked: ["?", "#555555", 0], available: ["o", "#e6c566", 1], cleared: ["o", "#e6c566", 1]},
  exit:      {locked: ["?", "#555555", 0], available: ["V", "#cc8866", 1], cleared: ["V", "#cc8866", 1]},
  encounter: {locked: [".", "#333333", 0], available: ["o", "#e6c566", 1], cleared: ["*", "#44aa44", 1]},
  boss:      {locked: [".", "#333333", 0], available: ["#", "#cc4444", 1], cleared: ["*", "#44aa44", 1]},
};
const MAP_TERRAIN = {
  "~": "#335588", "*": "#886655", ".": "#444444", "|": "#555555", "/": "#555555",
  "\\": "#555555", "_": "#555555", "-": "#444444", "=": "#555555", "(": "#555555",
  ")": "#555555", "[": "#555555", "]": "#555555", "{": "#555555", "}": "#555555",
  "#": "#555555", "+": "#555555",
};
function terrainStyle(ch) {
  if (ch === " ") return null;
  if (MAP_TERRAIN[ch]) return [MAP_TERRAIN[ch], 0];
  if (/[a-zA-Z]/.test(ch)) return ["#666666", 0];
  return ["#555555", 0];
}
function mapHtml(m, selId) {
  const H = m.art.length, W = m.width;
  const grid = m.art.map(line => Array.from(line.padEnd(W)));
  const style = Array.from({length: H}, () => new Array(W).fill(null));
  for (const c of (m.path_cells || [])) {
    if (c.row >= 0 && c.row < H && c.col >= 0 && c.col < W)
      style[c.row][c.col] = [c.traversed ? "#44aa44" : "#333333", 0];
  }
  for (const a of m.anchors) {
    if (a.row < 0 || a.row >= H || a.col < 0 || a.col >= W) continue;
    if (a.id === selId) {
      grid[a.row][a.col] = "X"; style[a.row][a.col] = ["#e6c566", 1];
      if (a.row >= 1 && a.col + 1 < W) {  // selection flag |>
        grid[a.row - 1][a.col] = "|"; grid[a.row - 1][a.col + 1] = ">";
        style[a.row - 1][a.col] = ["#e6c566", 1];
        style[a.row - 1][a.col + 1] = ["#e6c566", 1];
      }
    } else {
      const table = MAP_MARKERS[a.anchor_type] || MAP_MARKERS.zone;
      const mk = table[a.status] || table.locked;
      grid[a.row][a.col] = mk[0]; style[a.row][a.col] = [mk[1], mk[2]];
    }
  }
  let out = "";
  for (let r = 0; r < H; r++) {
    let run = "", cur = null;
    const flush = () => {
      if (!run) return;
      out += cur
        ? `<span style="color:${cur[0]}${cur[1] ? ";font-weight:700" : ""}">${esc(run)}</span>`
        : esc(run);
      run = "";
    };
    for (let c = 0; c < W; c++) {
      const st = style[r][c] || terrainStyle(grid[r][c]);
      const key = st ? st[0] + st[1] : "";
      if (key !== (cur ? cur[0] + cur[1] : "")) { flush(); cur = st; }
      run += grid[r][c];
    }
    flush();
    out += "\n";
  }
  return out;
}
function mapDetailCard(m) {
  const a = m.anchors.find(x => x.id === ui.mapSel);
  if (!a) return "";
  const primary = `class="primary" style="width:auto;flex:0 0 auto"`;

  switch (a.tap_action) {
    case "enter_zone":
      btn = `<button ${primary} data-a="enter-zone" data-id="${esc(a.id)}">${a.status === "cleared" ? "Re-enter" : "Embark"}</button>`; break;
    case "enter_town":
      btn = `<button class="gold" data-a="enter-town" data-id="${esc(a.id)}">⌂ Visit</button>`; break;
    case "fight":
      btn = `<button ${primary} data-a="fight">⚔ Fight</button>`; break;
    case "leave_zone":
      btn = `<button data-a="leave-zone">← Leave</button>`; break;
    case "leave_town":
      btn = `<button data-a="leave-town">← Leave</button>`; break;
    case "travel":
      btn = `<button class="gold" data-a="map-travel" data-id="${esc(a.travel_to || "")}">Travel →</button>`; break;
    case "shop":

function mapPanel(m) {
  if (!m || !m.art.length) return "";
  if (ui.mapKey !== m.map_key || !m.anchors.some(a => a.id === ui.mapSel)) {
    ui.mapKey = m.map_key;

    ui.mapScrolled = false;
  }
  const taps = m.navigable_ids.map(id => {
    const a = m.anchors.find(x => x.id === id);
    if (!a) return "";
    return `<div class="maptap" data-a="map-sel" data-id="${esc(id)}"
      style="left:calc(${a.col}ch + 0.5ch);top:${a.row * MAP_LINE_H + MAP_LINE_H / 2}px"></div>`;
  }).join("");
  return `<div class="mapscroll" id="mapscroll"><div class="mapwrap">
    <pre class="map">${mapHtml(m, ui.mapSel)}</pre>${taps}</div></div>` + mapDetailCard(m);
}
function restoreMapScroll() {
  const sc = document.getElementById("mapscroll");
  if (!sc) return;
  if (ui.mapScrolled && ui.mapScroll) {
    sc.scrollLeft = ui.mapScroll.left; sc.scrollTop = ui.mapScroll.top;
    return;
  }
  // First render of this map: center on the selected anchor
  const sel = S.map && S.map.anchors.find(a => a.id === ui.mapSel);
  if (sel) {
    sc.scrollLeft = Math.max(0, sel.col * charWidth(sc) + 6 - sc.clientWidth / 2);
    sc.scrollTop = Math.max(0, sel.row * MAP_LINE_H + 6 - sc.clientHeight / 2);
  }
  ui.mapScrolled = true;
  ui.mapScroll = {left: sc.scrollLeft, top: sc.scrollTop};
}
function charWidth(scroller) {
  const pre = scroller.querySelector("pre.map");
  if (!pre || !S.map || !S.map.width) return 7;
  return pre.getBoundingClientRect().width / S.map.width;
}

        body += `<div class="dim small" style="margin-top:6px">on:</div><div class="chips">` +
          livingPlayers().map(x =>
            `<button class="chip ${d.itemTarget === x.id ? "sel" : ""}" data-a="set-itemtgt" data-c="${esc(p.id)}" data-id="${esc(x.id)}">${esc(x.name)}</button>`).join("") + `</div>`;
      }
    } else if (ab && ab.target === "SINGLE_ENEMY" && livingEnemies().length > 1) {
      const targets = taunters.length
        ? livingEnemies().filter(e => taunters.includes(e.id))
        : livingEnemies();
      body += `<div class="dim small" style="margin-top:6px">target:</div><div class="chips">` +
        targets.map(e =>
          `<button class="chip ${resolveTargetFor(p, d.ability, d.target) === e.id ? "sel" : ""}" data-a="set-tgt" data-c="${esc(p.id)}" data-id="${esc(e.id)}">
            ${esc(e.name)} <span class="dim">${e.hp}</span></button>`).join("") + `</div>`;
    } else if (ab && ab.target === "SINGLE_ALLY" && livingPlayers().length > 1) {
      body += `<div class="dim small" style="margin-top:6px">ally:</div><div class="chips">` +
        livingPlayers().map(x =>
          `<button class="chip ${resolveTargetFor(p, d.ability, d.target) === x.id ? "sel" : ""}" data-a="set-tgt" data-c="${esc(p.id)}" data-id="${esc(x.id)}">${esc(x.name)}</button>`).join("") + `</div>`;
    }
    if (d.mode === "cheat") {
      body += `<div class="row" style="margin-top:10px"><span class="dim small grow">extra actions (AP)</span>
        <div class="stepper">
          <button data-a="ap-dec" data-c="${esc(p.id)}">−</button><span>${d.ap}</span>
          <button data-a="ap-inc" data-c="${esc(p.id)}">+</button>
        </div></div>`;
      body += d.extras.map((_, i) => slotRow(p, d, "x" + i, "Extra " + (i + 1), false)).join("");
    }
    if (p.speed_bonus > 0) {
      body += d.bonus.map((_, i) => slotRow(p, d, "b" + i, "Bonus " + (i + 1), true)).join("");
    }
  } else {
    body = `<div class="dim small" style="margin-top:8px">Braced: damage halved, +1 AP banked.</div>`;
  }
  const dh = dispHp(p);
  return `<div class="card">
    <div class="row"><div class="grow"><span class="name">${esc(p.name)}</span>${badges}</div>
      <span class="small" data-hptext="${esc(p.id)}">${dh.hp}/${p.max_hp}</span></div>
    ${hpbar(dh.hp, p.max_hp, p.id)}
    ${p.statuses.length ? `<div class="status">${p.statuses.map(esc).join(" · ")}</div>` : ""}
    <div class="seg">
      <button class="${d.mode === "normal" ? "sel" : ""}" data-a="set-mode" data-c="${esc(p.id)}" data-id="normal">Act</button>
      <button class="${d.mode === "survive" ? "sel" : ""}" ${taunters.length ? "disabled" : ""} data-a="set-mode" data-c="${esc(p.id)}" data-id="survive">Survive</button>
      <button class="${d.mode === "cheat" ? "sel" : ""}" ${p.ap > 0 ? "" : "disabled"} data-a="set-mode" data-c="${esc(p.id)}" data-id="cheat">Cheat</button>
    </div>
    ${body}
  </div>`;
}
function screenCombat() {
  const c = S.combat;
  if (!c) return topbar() + `<div class="card">No combat state.</div>`;
  const evs = ui.verbose ? (S.events || []) : (S.events_summary || []);
  const log = (evs.length || ui.pb)
    ? `<div class="row" style="margin-top:10px"><span class="section grow" style="margin:0 2px">ROUND LOG</span>
        <button class="small" data-a="toggle-verbose">Aa ${ui.verbose ? "verbose" : "summary"}</button></div>
       <div class="log" id="log">${ui.pb ? "" : evs.map(evLine).join("")}</div>`
    : "";
  const bottom = ui.pb
    ? `<button class="primary" data-a="pb-skip">⏩ Skip</button>`
    : `<div class="row">
        ${c.auto_available && !c.auto_halt && !ui.auto
          ? `<button class="gold" data-a="auto-start">▶ Auto</button>` : ""}
        ${ui.auto ? `<button class="danger" data-a="auto-stop">⏹ Stop</button>` : ""}
        <button class="primary grow" data-a="submit-round" ${ui.auto ? "disabled" : ""}>⚔ Resolve Round</button>
      </div>`;
  return topbar() + `
    <div class="section">ROUND ${c.round_number + 1} — ENEMIES</div>${enemyCards()}
    ${log}
    <div class="section">YOUR MOVE</div>
    ${livingPlayers().map(decisionCard).join("")}
    <div class="sticky-bottom">${bottom}</div>`;
}
function finalRoundLog() {
  // The round that ended the fight, replayed paced on the next screen
  const evs = ui.verbose ? (S.events || []) : (S.events_summary || []);
  if (!evs.length && !ui.pb) return "";
  return `<div class="log" id="log" style="margin:8px 0">${ui.pb ? "" : evs.map(evLine).join("")}</div>`;
}
function screenLoot() {
  const loot = S.loot || {money: 0, items: []};
  const chips = loot.items.map((it, i) =>
    `<button class="chip ${ui.lootSel.has(i) ? "sel" : ""}" data-a="toggle-loot" data-i="${i}"
      title="${esc(itemDetail(it))}">${esc(it.name)} <span class="dim">${esc(it.type)}</span></button>`).join("");
  const free = S.party ? S.party.stash_limit - S.party.stash_used : 0;
  const overflow = loot.items.length && ui.lootSel.size > free;
  return topbar() + `
    <div class="card"><div class="name" style="color:var(--gold)">Won the fight</div>
      <div class="small">+${loot.money}g</div></div>
    ${finalRoundLog()}
    ${S.text ? `<details><summary>Battle report</summary><pre class="text">${esc(S.text)}</pre></details>` : ""}
    ${loot.items.length ? `<div class="section">LOOT — tap to toggle</div><div class="chips">${chips}</div>` : `<div class="dim small" style="margin:10px 2px">No drops.</div>`}
    ${overflow ? `<div class="dim small" style="margin:6px 2px;color:var(--yellow)">⚠ ${ui.lootSel.size} picked, ${free} stash slots free — drop something below or deselect.</div>` : ""}
    ${partyStrip()}
    ${stashPanel({})}
    <div class="sticky-bottom"><div class="row">
      <button class="primary grow" data-a="loot-take">${loot.items.length ? `Take (${ui.lootSel.size})` : "Continue"}</button>
    </div></div>`;
}
function screenRecruit() {
  const r = S.recruit;
  if (!r) {
    return topbar() + `<div class="section">A WANDERER APPROACHES</div>
      <pre class="text">${esc(S.text)}</pre>
      <div class="sticky-bottom"><div class="row">
        <button class="grow" data-a="recruit-no">Decline</button>
        <button class="primary grow" data-a="recruit-yes">Recruit</button>
      </div></div>`;
  }
  let detail = "";
  if (r.growth) {
    detail += `<div class="dim small" style="margin-top:8px">growth / level</div>` +
      Object.entries(r.growth).map(([k, v]) =>
        `<div class="row small"><span class="dim grow">${k}</span><span>+${v}</span></div>`).join("");
  }
  if (r.stats) {
    detail += `<div class="dim small" style="margin-top:8px">stats (Lv${r.level ?? "?"} · ${r.hp ?? "?"} HP)</div>` +
      Object.entries(r.stats).map(([k, v]) =>
        `<div class="row small"><span class="dim grow">${k}</span><span>${v}</span></div>`).join("");
  }
  const gate = r.inspection === "FULL" ? ""
    : `<div class="dim small" style="margin-top:8px">CHA ${r.cha} — ${r.inspection === "MODERATE"
        ? "70+ reveals stats" : "30+ reveals growth, 70+ reveals stats"}</div>`;
  return topbar() + `
    <div class="section">A WANDERER APPROACHES</div>
    <div class="card">
      <div class="name">${esc(r.name)} <span class="dim">${esc(r.job_name)}${r.level ? " Lv" + r.level : ""}</span></div>
      ${r.equipment.length ? `<div class="dim small">carries: ${r.equipment.map(esc).join(", ")}</div>` : ""}
      ${detail}${gate}
      <div class="dim small" style="margin-top:8px">party ${r.party_size}/${r.max_party}${r.party_full ? " — FULL: dismiss someone below first" : ""}</div>
    </div>
    ${r.party_full ? partyDetails() : ""}
    <div class="sticky-bottom"><div class="row">
      <button class="grow" data-a="recruit-no">Decline</button>
      <button class="primary grow" ${r.party_full ? "disabled" : ""} data-a="recruit-yes">Recruit</button>
    </div></div>`;
}
function recapCard() {
  const r = S.recap;
  if (!r) return S.text ? `<pre class="text">${esc(S.text)}</pre>` : "";
  const row = (k, v) => `<div class="row small"><span class="dim grow">${k}</span><span>${v}</span></div>`;
  return `<div class="card">
    <div class="name">${esc(r.mc_name)} <span class="dim">Lv${r.mc_level}</span></div>
    <div style="margin-top:6px">
      ${row("zones cleared", r.zones_completed.length)}
      ${row("encounters", `${r.encounters} (${r.victories}W / ${r.defeats}L)`)}
      ${row("rounds fought", r.rounds)}
      ${row("damage dealt", r.damage_dealt)}
      ${row("damage taken", r.damage_taken)}
      ${row("healing", r.healing)}
      ${row("ally deaths", r.character_deaths)}
      ${row("gold at end", r.gold + "g")}
    </div></div>
    ${S.text ? `<details><summary>Full report</summary><pre class="text">${esc(S.text)}</pre></details>` : ""}`;
}
function screenDead() {
  return `
    <h1 style="color:var(--red)">FALLEN</h1>
    ${finalRoundLog()}
    ${recapCard()}
    ${screenSetup(`<div class="section">RISE AGAIN</div>`)}`;
}
function screenVictory() {
  return `
    <h1 style="color:var(--gold)">VICTORY</h1>
    <div class="sub">the region is cleansed</div>
    ${recapCard()}
    ${screenSetup(`<div class="section">ANOTHER HERESY</div>`)}`;
}

function render() {
  if (!S) return;
  const app = document.getElementById("app");
  const nameEl = document.getElementById("mc-name");
  const savedName = nameEl ? nameEl.value : null;
  const oldMapScroll = document.getElementById("mapscroll");
  if (oldMapScroll) {
    ui.mapScroll = {left: oldMapScroll.scrollLeft, top: oldMapScroll.scrollTop};
  }
  let html;
  switch (S.phase) {
    case "SETUP": html = screenSetup(); break;
    case "ZONE_SELECT": html = screenZoneSelect(); break;
    case "IN_TOWN": html = screenTown(); break;
    case "IN_ZONE": html = screenZone(); break;
    case "COMBAT": html = screenCombat(); break;
    case "POST_COMBAT": html = screenLoot(); break;
    case "RECRUITING": html = screenRecruit(); break;
    case "DEAD": html = screenDead(); break;
    case "VICTORY": html = screenVictory(); break;
    default: html = topbar() + `<pre class="text">${esc(S.text)}</pre>`;
  }
  app.innerHTML = html;
  const nameEl2 = document.getElementById("mc-name");
  if (nameEl2 && savedName != null) nameEl2.value = savedName;
  restoreMapScroll();
  const log = document.getElementById("log");
  if (log) log.scrollTop = log.scrollHeight;
}

// ---------- one delegated click handler ----------
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-a]");
  if (!el || el.disabled) return;
  const a = el.dataset.a, id = el.dataset.id, cid = el.dataset.c, i = el.dataset.i;
  const d = cid ? ui.D[cid] : null;
  switch (a) {
    case "sel-job": ui.selJob = id; render(); break;
    case "start-run": {
      if (!ui.selJob) { toast("Pick a job first"); return; }
      const name = (document.getElementById("mc-name")?.value || "Wanderer").trim() || "Wanderer";
      act("new_run", {name, job_id: ui.selJob}); break;
    }
    case "load-save": act("load_run", {slot: "autosave"}); break;
    case "save": act("save_run", {slot: "autosave"}); break;
    case "enter-zone": act("enter_zone", {zone_id: id}); break;
    case "leave-zone": act("leave_zone"); break;
    case "enter-town": act("enter_town", {town_id: id}); break;
    case "map-sel": ui.mapSel = id; render(); break;
    case "map-goto": document.getElementById(id)?.scrollIntoView({behavior: "smooth"}); break;
    case "map-travel": {
      // Boss travel tile: leave the cleared zone, then enter the next one.
      (async () => {
        await api("/api/action", {tool: "leave_zone", args: {}});
        if (S && !S.error) await api("/api/action", {tool: "enter_zone", args: {zone_id: id}});
      })();
      break;
    }
    case "leave-town": act("leave_town"); break;
    case "rest": act("rest_at_lodge"); break;
    case "buy": act("shop_buy", {item_id: id}); break;
    case "sell": act("shop_sell", {item_id: id}); break;
    case "fight": act("fight"); break;
    case "pick-use": ui.pickUse = Number(i); ui.equipPreview = null; render(); break;
    case "pick-cancel": ui.pickUse = null; render(); break;
    case "use-on": {
      const it = S.party.stash[Number(i)]; ui.pickUse = null;
      act("use_consumable", {item_id: it.id, character_id: el.dataset.c}); break;
    }
    case "teach-on": {
      const it = S.party.stash[Number(i)]; ui.pickUse = null;
      act("use_scroll", {item_id: it.id, character_id: el.dataset.c}); break;
    }
    case "equip-pick": {
      const it = S.party.stash[Number(i)];
      fetchEquipPreview(el.dataset.c, it.id); break;
    }
    case "equip-confirm": {
      const ep = ui.equipPreview;
      if (ep) act("equip", {character_id: ep.cid, item_id: ep.item_id, slot: ep.data.slot});
      break;
    }
    case "equip-cancel": ui.equipPreview = null; render(); break;
    case "unequip": act("unequip", {character_id: el.dataset.c, slot: el.dataset.slot}); break;
    case "confirm-arm": ui.confirm = el.dataset.key; render(); break;
    case "confirm-cancel": ui.confirm = null; render(); break;
    case "drop-item": act("drop_item", {item_id: id}); break;
    case "bench": act("swap_roster", {active_id: el.dataset.c}); break;
    case "promote": act("swap_roster", {reserve_id: el.dataset.c}); break;
    case "dismiss-char": act("dismiss", {character_id: el.dataset.c}); break;
    case "mimic-confirm": act("mc_swap_job", {job_id: id}); break;
    // combat decision editing (local only)
    case "set-mode": {
      d.mode = id;
      if (id === "cheat") {
        d.ap = Math.max(1, Math.min(d.ap, playerAP(cid)));
        while (d.extras.length < d.ap) d.extras.push(newSlot());
        d.extras.length = d.ap;
      }
      render(); break;
    }
    case "set-abil": d.ability = id; d.useItem = false; d.target = null; render(); break;
    case "set-tgt": d.target = id; render(); break;
    case "set-useitem": d.useItem = !d.useItem; render(); break;
    case "set-item": d.item = id; render(); break;
    case "set-itemtgt": d.itemTarget = id; render(); break;
    case "ap-inc": if (d.ap < playerAP(cid)) { d.ap++; d.extras.push(newSlot()); } render(); break;
    case "ap-dec": if (d.ap > 1) { d.ap--; d.extras.pop(); } render(); break;
    case "slot-edit": d.editSlot = d.editSlot === el.dataset.k ? null : el.dataset.k; render(); break;
    case "slot-abil": { const s = getSlot(d, el.dataset.k); s.ability = id; s.target = null; render(); break; }
    case "slot-tgt": { const s = getSlot(d, el.dataset.k); s.target = id; render(); break; }
    case "slot-skip": {
      d.bonus[+el.dataset.k.slice(1)] = null;
      if (d.editSlot === el.dataset.k) d.editSlot = null;
      render(); break;
    }
    case "slot-unskip": d.bonus[+el.dataset.k.slice(1)] = newSlot(); render(); break;
    case "submit-round": {
      const dec = buildDecisions();
      if (dec) act("submit_decisions", {decisions: dec});
      break;
    }
    case "pb-skip": pbSkip(); break;
    case "toggle-verbose": {
      if (ui.pb) pbSkip();  // settle the running playback first
      ui.verbose = !ui.verbose;
      localStorage.setItem("hx_log", ui.verbose ? "verbose" : "summary");
      render(); break;
    }
    case "auto-start": ui.auto = true; act("auto_battle_round"); break;
    case "auto-stop": ui.auto = false; render(); break;
    case "toggle-loot": {
      const n = Number(i);
      ui.lootSel.has(n) ? ui.lootSel.delete(n) : ui.lootSel.add(n);
      render(); break;
    }
    case "loot-take": {
      const ids = (S.loot?.items || []).filter((_, n) => ui.lootSel.has(n)).map(it => it.id);
      act("pick_loot", {item_ids: ids}); break;
    }
    case "recruit-yes": act("recruit", {accept: true}); break;
    case "recruit-no": act("recruit", {accept: false}); break;
  }
});
function playerAP(cid) {
  const p = livingPlayers().find(x => x.id === cid);
  return p ? Math.max(1, p.ap) : 1;
}

api("/api/state");

// PWA shell. Service workers need a secure context: https, localhost,
// or (Android over LAN) chrome://flags/#unsafely-treat-insecure-origin-as-secure
// with this origin added. iOS installs fullscreen from the apple-* metas
// regardless.
if ("serviceWorker" in navigator && window.isSecureContext) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
