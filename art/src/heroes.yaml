# Map heroes: one chibi body (16x24, anchored bottom-centre) drawn in the
# semantic `hero` palette, then palette-swapped per job and topped with a
# job accessory (helm, eboshi, hood...). `right` is the mirrored `left`.
#
# Semantic chars (see palettes.yaml `hero`):
#   K outline  s shadow  h/H/d hair  f/F skin  e eye
#   a/A/b garment  c/C trim  l/L legs  o/O boots  t/T/u accessory
sheet: heroes
defaults:
  palette: hero
  ax: 8


