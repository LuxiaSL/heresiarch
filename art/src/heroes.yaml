generate:
  - name: "hero_{job}_{dir}_{f}"
    for:
      job: [default, einherjar, onmyoji, berserker, martyr, sacrist]
      dir: [down, up, left]
      f: [0, 1, 2]
    spec:
      from: "body_{dir}_{f}"
      swap: {hero: "hero_{job}"}
      layers:
        - sprite: "acc_{job}_{dir}"
          optional: true
          swap: {hero: "hero_{job}"}
  - name: "hero_{job}_right_{f}"
    for:
      job: [default, einherjar, onmyoji, berserker, martyr, sacrist]
      f: [0, 1, 2]
    spec:
      from: "hero_{job}_left_{f}"
      mirror: true
