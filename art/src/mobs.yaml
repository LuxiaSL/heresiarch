# Map enemies ("symbol" sprites that wander the floor). 16x16, bosses
# 24x24, 2-frame bounce, anchored bottom-centre. One slime body per size
# class drawn in the semantic `slime` palette; variants are palette swaps
# plus an accessory layer. Bodies were first drafted by
# art/tools/draft_slime.py, then edited by hand.
#
# Semantic chars: K outline  s shadow  1 specular  2-5 body light->deep
#   e eye  w eye shine  m mouth  t/T/u accessory  g/G glow  v void
